# Autopublish: every push to main releases what it changed. autorelease.mjs moves ztrack to its
# next patch version when anything it ships changed since its last release; the changelog's
# Unreleased notes become that version's section, the package is built and published, and the
# release commit, the tag and the GitHub release go back. Auth is the repository secret NPM_TOKEN.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACKAGES: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: git config core.fileMode false
      - name: Version what changed since its last release
        id: release
        run: node .github/autorelease.mjs
      - name: Is this version on npm yet
        id: check
        run: |
          v="$(node -p "require('./package.json').version")"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "ztrack@$v" version 2>/dev/null)" ]; then echo "$v is published"; else echo "$v is new"; echo new=1 >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.new
        name: The lockfile and the changelog's section follow the version
        env:
          V: ${{ steps.check.outputs.version }}
        run: |
          bun install
          if ! grep -q "^## $V$" CHANGELOG.md; then
            awk -v v="$V" '!done && /^## Unreleased$/ { print; print ""; print "## " v; done = 1; next } { print }' CHANGELOG.md > "$RUNNER_TEMP/changelog" && mv "$RUNNER_TEMP/changelog" CHANGELOG.md
          fi
      - if: steps.check.outputs.new
        run: cd visualizer && bun install
      - if: steps.check.outputs.new
        name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm publish --provenance --access public 2>"$RUNNER_TEMP/err"; then
            cat "$RUNNER_TEMP/err"; grep -qi 'cannot publish over' "$RUNNER_TEMP/err" || exit 1
          fi
      - if: steps.check.outputs.new
        name: The release commit, the tag and the GitHub release
        env:
          V: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock CHANGELOG.md
          git diff --cached --quiet || git commit -qm "Release $V"
          git reset -q --hard HEAD
          for attempt in 1 2 3 4 5; do
            if git pull -q --rebase origin main; then git push -q origin HEAD:main && break; else git rebase --abort; fi
            [ "$attempt" = 5 ] && exit 1; sleep 5
          done
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null || { git tag -a "v$V" -m "v$V" && git push -q origin "v$V"; }
          # The Action's major tag (volter-ai/ztrack@v1) follows the release it belongs to.
          git tag -f "v${V%%.*}" "v$V^{}" && git push -q -f origin "v${V%%.*}"
          notes=$(awk -v h="## $V" '$0 == h { p = 1; next } p && /^## / { exit } p' CHANGELOG.md | sed '/^$/d')
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "v$V" --notes "${notes:-v$V}"
